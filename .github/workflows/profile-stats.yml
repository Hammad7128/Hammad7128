name: Refresh profile statistics

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate cards from public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_stats.py
      - name: Save updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-languages.svg
          if git diff --cached --quiet; then
            echo "Statistics are already up to date."
            exit 0
          fi
          git commit -m "Refresh public profile statistics"
          git pull --rebase origin main
          git push origin HEAD:main
